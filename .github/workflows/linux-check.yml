name: Linux check (scratch)

# Scratch workflow for the fork only: runs the Linux gates for the crates the
# local-root change touches. Never part of the pull request.
on:
  push:
    branches:
      - "ci/**"

permissions:
  contents: read

jobs:
  linux:
    name: Changed crates on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: 16777216
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - run: |
          rustup toolchain install
          cargo --version
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true
      # Does the listing-order test fail on unpatched upstream too?
      - name: Same test on this branch and on upstream main
        shell: pwsh
        run: |
          $test = 'a_durable_store_keeps_its_whiteouts_out_of_sight'
          cargo test --locked -p omnigraph-storage --lib $test *> patched.log
          $patched = $LASTEXITCODE
          git fetch --depth 1 https://github.com/ModernRelay/omnigraph main
          $upstream = git rev-parse FETCH_HEAD
          git worktree add ../upstream FETCH_HEAD
          Push-Location ../upstream
          cargo test --locked -p omnigraph-storage --lib $test *> ../upstream.log
          $base = $LASTEXITCODE
          Pop-Location
          $tail = (Get-Content ../upstream.log | Select-String -Pattern 'left:|right:|test result' | ForEach-Object { $_.Line.Trim() }) -join ' | '
          Write-Host "::notice::$test exit codes: this branch=$patched, upstream main $upstream=$base. Upstream output: $tail"
          exit 0
