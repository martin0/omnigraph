name: Windows smoke

# Local storage roots on Windows (issue #907): the path unit tests, then the
# built CLI and server against a standalone graph, its branches, a local
# cluster root and a server booted from that root. No other job runs the
# binaries on Windows; the release archive job only checks that they start.
# Nothing waits on this workflow (docs/dev/ci.md).
on:
  pull_request:
    paths:
      - "crates/omnigraph-storage/**"
      - "crates/omnigraph-cluster/**"
      - "crates/omnigraph-cli/**"
      - "crates/omnigraph-server/**"
      - "scripts/windows-smoke.ps1"
      - ".github/workflows/windows-smoke.yml"
      - "Cargo.lock"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Local roots on Windows
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        run: choco install protoc -y

      # rust-toolchain.toml pins the toolchain; this installs exactly that.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          cargo --version

      # Saved from `main` only, like every other cache here (docs/dev/ci.md).
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Local-root unit tests
        run: cargo test --locked -p omnigraph-storage --lib local_root

      # Unoptimised frames overflow Windows' default 1 MiB main-thread stack
      # (Linux gives the main thread 8 MiB), so the smoke binaries link with
      # the 16 MiB the test jobs give their threads through RUST_MIN_STACK.
      # The flag reaches only the final link of each binary.
      - name: Build the CLI
        run: cargo rustc --locked -p omnigraph-cli --bin omnigraph -- -C link-arg=/STACK:16777216

      - name: Build the server
        run: cargo rustc --locked -p omnigraph-server --bin omnigraph-server -- -C link-arg=/STACK:16777216

      - name: Smoke local roots
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Bin target/debug
